# =============================================================================
# env.yml -- SQL environment variables for dbt Projects on Snowflake
# =============================================================================
# Snowflake resolves this file at EXECUTE DBT PROJECT time, picks the active
# environment, evaluates any SQL values, and injects the results as environment
# variables. profiles.yml then reads them with env_var(), so one profile drives
# every environment.
#
# What is environment-aware:
#   * Semantic views, staging models, and evaluations build into
#     {DBT_DATABASE}.{DBT_SCHEMA} automatically (they inherit the dbt target).
#   * The agent spec is a raw file dbt does not render, so create_agent /
#     alter_agent substitute <<DATABASE>>/<<SCHEMA>>/<<WAREHOUSE>> tokens.
#   * Raw sources (models/sources.yml) are intentionally NOT env-driven -- every
#     developer reads the same raw input tables.
#
# Rules to remember:
#   * Keys must be DBT_ prefixed and UPPERCASE (DBT_SCHEMA, not schema).
#   * SQL values must be double-quoted: "{{ select CURRENT_USER() }}".
#   * env.yml lives next to dbt_project.yml (project root).
#
# See: https://docs.snowflake.com/en/user-guide/data-engineering/dbt-projects-on-snowflake-environment-variables
# =============================================================================

env_config:
  default_environment: dev
  environments:

    # -------------------------------------------------------------------------
    # dev -- per-developer isolation. Each engineer's agents, semantic views,
    # and evaluations land in a schema named after their username, so nobody
    # overwrites anyone else while iterating.
    # -------------------------------------------------------------------------
    - name: dev
      env:
        DBT_DATABASE: DEMO_DB
        DBT_SCHEMA: "{{ select CURRENT_USER() }}"       # per-developer schema
        DBT_WAREHOUSE: COMPUTE_WH
        DBT_ROLE: "{{ select CURRENT_ROLE() }}"         # whatever role you run as

    # -------------------------------------------------------------------------
    # staging -- shared pre-prod schema for integration testing.
    # -------------------------------------------------------------------------
    - name: staging
      env:
        DBT_DATABASE: DEMO_DB
        DBT_SCHEMA: CORTEX_AGENTS
        DBT_WAREHOUSE: COMPUTE_WH
        DBT_ROLE: "{{ select CURRENT_ROLE() }}"

    # -------------------------------------------------------------------------
    # prod -- shared production schema. SYSADMIN owns the created objects.
    # -------------------------------------------------------------------------
    - name: prod
      env:
        DBT_DATABASE: DEMO_DB
        DBT_SCHEMA: CORTEX_AGENTS
        DBT_WAREHOUSE: COMPUTE_WH
        DBT_ROLE: "{{ select CURRENT_ROLE() }}"
